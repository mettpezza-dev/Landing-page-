<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Studenti - English Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-700">
    <h2 class="text-3xl font-bold mb-2 text-center">Area Studenti</h2>
    <p class="text-slate-400 text-center mb-6">Accedi per consultare i tuoi corsi e lezioni</p>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Email</label>
        <input type="email" id="email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-lg transition">Accedi</button>
    </form>
    <p id="errorMsg" class="text-red-400 text-sm mt-4 text-center hidden"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AiZaSyCcdu1Tbezrgw9uMEe9uoNYZLwf-8",
      authDomain: "english-academy-dfb76.firebaseapp.com",
      projectId: "english-academy-dfb76",
      storageBucket: "english-academy-dfb76.firebasestorage.app",
      messagingSenderId: "894159383786",
      appId: "1:894159383786:web:5b0ae4c5784d48e9327b93",
      measurementId: "G-YYTKFZSWWS"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "/dashboard.html";
      } catch (error) {
        console.error(error);
        errorMsg.textContent = "Email o password non valide: " + error.code;
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
