<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La tua Dashboard - English Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center bg-slate-800 p-6 rounded-2xl border border-slate-700">
      <div>
        <h1 class="text-2xl font-bold" id="welcomeUser">Benvenuto Studente!</h1>
        <p class="text-slate-400 text-sm">Ecco lo stato del tuo percorso</p>
      </div>
      <button id="logoutBtn" class="bg-red-600 hover:bg-red-500 px-4 py-2 rounded-lg font-semibold text-sm">Esci</button>
    </div>

    <!-- Progresso Corso -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-xl font-bold text-blue-400" id="courseName">Corso in caricamento...</h2>
        <span class="text-lg font-bold text-teal-400" id="progressPercent">0%</span>
      </div>
      <!-- Barra di Stato -->
      <div class="w-full bg-slate-700 h-4 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-teal-400 h-full w-0 transition-all duration-500"></div>
      </div>
      <p class="text-sm text-slate-400" id="lessonsStatus">Lezioni completate: 0 su 0</p>
    </div>

    <!-- Lista Lezioni -->
    <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
      <h3 class="text-lg font-bold mb-4">Lezioni del Percorso</h3>
      <ul id="lessonsList" class="space-y-3">
        <li class="text-slate-400">Caricamento lezioni in corso...</li>
      </ul>
    </div>
  </div>
</body>
</html>
